[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-reliability-lab"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi==0.115.12", "starlette==0.46.2", "anyio==4.9.0", "httpx==0.28.1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
openai = ["openai==3.42.0"]

[project.scripts]
reliability-lab = "lab.cli:main"

[tool.setuptools.packages.find]
include = ["lab*", "target_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
